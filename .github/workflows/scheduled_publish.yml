name: Scheduled LinkedIn Publish

# Publishes the oldest queued draft (from /publish in Telegram) at the
# highest-reach window per 2026 LinkedIn engagement data: Tue/Wed/Thu,
# 10:30 AM IST. Skipped entirely on Mon/Fri/weekends -- queued drafts on
# those days just wait for the next valid run rather than posting on a
# weaker day. See positioning_strategy.md for why quality/consistency over
# raw daily volume is the deliberate choice here.

on:
  schedule:
    # 10:30 AM IST = 05:00 UTC, every day. Weekend/Monday reach is
    # somewhat lower per 2026 engagement data than Tue-Thu, but daily
    # consistency was the deliberate tradeoff here -- same best time-of-day
    # slot is kept regardless of which day it lands on.
    - cron: "0 5 * * *"
  workflow_dispatch: {}   # manual trigger for testing

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish today's queued draft (if any)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.scheduled_publish
